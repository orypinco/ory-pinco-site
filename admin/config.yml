backend:
  name: github
  repo: orypinco/ory-pinco-site
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

site_url: https://www.orypinco.com
display_url: https://www.orypinco.com

collections:
  - name: "site"
    label: "Website Content"
    files:
      - file: "content/site.json"
        label: "Site Text (English & Hebrew)"
        name: "site"
        fields:

          - label: "English"
            name: "en"
            widget: "object"
            fields: &lang_fields
              - label: "Contact Details (used everywhere on the site)"
                name: "meta"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Email", name: "email", widget: "string"}
                  - {label: "Phone (display format)", name: "phone", widget: "string"}
                  - {label: "Phone (tel: link, digits only, e.g. 0040775467883)", name: "telLink", widget: "string"}

              - label: "Navigation"
                name: "nav"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Services link", name: "services", widget: "string"}
                  - {label: "Why Romania link", name: "why", widget: "string"}
                  - {label: "Romania <-> Israel link", name: "bridge", widget: "string"}
                  - {label: "About link", name: "about", widget: "string"}
                  - {label: "Let's Talk button", name: "cta", widget: "string"}

              - label: "Home Page"
                name: "home"
                widget: "object"
                collapsed: true
                fields:
                  - label: "Hero"
                    name: "hero"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Lead paragraph", name: "lead", widget: "text"}
                      - {label: "Second paragraph", name: "lead2", widget: "text"}
                      - {label: "Primary button", name: "ctaPrimary", widget: "string"}
                      - {label: "Secondary button", name: "ctaSecondary", widget: "string"}
                  - label: "Why Romania (teaser)"
                    name: "why"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Subtitle", name: "subtitle", widget: "text"}
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.title}}"
                        fields:
                          - {label: "Title", name: "title", widget: "string"}
                          - {label: "Description", name: "desc", widget: "text"}
                      - {label: "Link to full page", name: "cta", widget: "string"}
                  - label: "What We Do (teaser)"
                    name: "services"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Subtitle", name: "subtitle", widget: "text"}
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.title}}"
                        fields:
                          - {label: "Title", name: "title", widget: "string"}
                          - {label: "Description", name: "desc", widget: "text"}
                      - {label: "Link to full page", name: "cta", widget: "string"}
                  - label: "How We Work"
                    name: "how"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Subtitle", name: "subtitle", widget: "text"}
                      - label: "Process steps"
                        name: "steps"
                        widget: "list"
                        field: {label: "Step", name: "step", widget: "string"}
                      - {label: "Note", name: "note", widget: "string"}
                  - label: "Track Record"
                    name: "track"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Tagline", name: "tagline", widget: "string"}
                      - {label: "Intro", name: "intro", widget: "text"}
                      - label: "Stats"
                        name: "stats"
                        widget: "list"
                        summary: "{{fields.label}}"
                        fields:
                          - {label: "Number", name: "number", widget: "string"}
                          - {label: "Label", name: "label", widget: "string"}
                          - {label: "Supporting text (optional)", name: "sub", widget: "string", required: false}
                  - label: "Who We Work With"
                    name: "who"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.title}}"
                        fields:
                          - {label: "Title", name: "title", widget: "string"}
                          - {label: "Description", name: "desc", widget: "text"}
                  - label: "Romania <-> Israel (teaser)"
                    name: "bridge"
                    widget: "object"
                    fields:
                      - {label: "Sub-label", name: "sub", widget: "string"}
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Subtitle", name: "subtitle", widget: "text"}
                      - {label: "Link to full page", name: "cta", widget: "string"}
                  - label: "About (teaser)"
                    name: "about"
                    widget: "object"
                    fields:
                      - {label: "Sub-label", name: "sub", widget: "string"}
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Paragraph 1", name: "p1", widget: "text"}
                      - {label: "Paragraph 2", name: "p2", widget: "text"}
                      - {label: "Link to full page", name: "cta", widget: "string"}
                  - label: "Final CTA"
                    name: "finalCta"
                    widget: "object"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                      - {label: "Button", name: "cta", widget: "string"}

              - label: "Services Page"
                name: "servicesPage"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Subtitle", name: "subtitle", widget: "text"}
                  - label: "Services"
                    name: "items"
                    widget: "list"
                    summary: "{{fields.title}}"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Description", name: "desc", widget: "text"}
                  - label: "Process"
                    name: "process"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - label: "Steps"
                        name: "steps"
                        widget: "list"
                        field: {label: "Step", name: "step", widget: "string"}
                      - {label: "Note", name: "note", widget: "string"}
                  - label: "Bottom CTA"
                    name: "ctaBlock"
                    widget: "object"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                      - {label: "Button", name: "cta", widget: "string"}

              - label: "Why Romania Page"
                name: "whyPage"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Intro paragraph 1", name: "intro1", widget: "text"}
                  - {label: "Intro paragraph 2", name: "intro2", widget: "text"}
                  - label: "Points"
                    name: "items"
                    widget: "list"
                    summary: "{{fields.title}}"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Description", name: "desc", widget: "text"}
                  - label: "Bottom CTA"
                    name: "ctaBlock"
                    widget: "object"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                      - {label: "Button", name: "cta", widget: "string"}

              - label: "Romania <-> Israel Page"
                name: "bridgePage"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Subtitle", name: "subtitle", widget: "text"}
                  - label: "Israel -> Romania"
                    name: "israelToRomania"
                    widget: "object"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Heading", name: "heading", widget: "string"}
                      - {label: "Intro", name: "intro", widget: "text"}
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        field: {label: "Item", name: "item", widget: "string"}
                  - label: "Romania -> Israel"
                    name: "romaniaToIsrael"
                    widget: "object"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Heading", name: "heading", widget: "string"}
                      - {label: "Intro", name: "intro", widget: "text"}
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        field: {label: "Item", name: "item", widget: "string"}
                  - label: "Cross-Border Trade"
                    name: "trade"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.title}}"
                        fields:
                          - {label: "Title", name: "title", widget: "string"}
                          - {label: "Description", name: "desc", widget: "text"}
                  - label: "Bottom CTA"
                    name: "ctaBlock"
                    widget: "object"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body (optional)", name: "body", widget: "string", required: false}
                      - {label: "Button", name: "cta", widget: "string"}

              - label: "About Page"
                name: "aboutPage"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Paragraph 1", name: "p1", widget: "text"}
                  - {label: "Paragraph 2", name: "p2", widget: "text"}
                  - label: "Our Approach"
                    name: "approach"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Paragraph 1", name: "p1", widget: "text"}
                      - {label: "Paragraph 2", name: "p2", widget: "text"}
                      - {label: "Paragraph 3", name: "p3", widget: "text"}
                  - label: "Founder"
                    name: "founder"
                    widget: "object"
                    fields:
                      - {label: "Name", name: "eyebrow", widget: "string"}
                      - {label: "Role", name: "role", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Paragraph 1", name: "p1", widget: "text"}
                      - {label: "Paragraph 2", name: "p2", widget: "text"}
                      - {label: "Paragraph 3", name: "p3", widget: "text"}
                  - label: "Track Record"
                    name: "track"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - label: "Stats"
                        name: "stats"
                        widget: "list"
                        summary: "{{fields.label}}"
                        fields:
                          - {label: "Number", name: "number", widget: "string"}
                          - {label: "Label", name: "label", widget: "string"}
                          - {label: "Supporting text (optional)", name: "sub", widget: "string", required: false}
                  - label: "The Team"
                    name: "team"
                    widget: "object"
                    fields:
                      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Paragraph 1", name: "p1", widget: "text"}
                      - {label: "Paragraph 2", name: "p2", widget: "text"}
                      - {label: "Statement", name: "statement", widget: "string"}
                  - label: "Bottom CTA"
                    name: "ctaBlock"
                    widget: "object"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                      - {label: "Button", name: "cta", widget: "string"}

              - label: "Contact Section"
                name: "contact"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                  - {label: "Title (HTML ok, <br> for line break)", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
                  - {label: "Email", name: "email", widget: "string"}
                  - {label: "Phone", name: "phone", widget: "string"}
                  - label: "Form"
                    name: "form"
                    widget: "object"
                    fields:
                      - {label: "Name field label", name: "name", widget: "string"}
                      - {label: "Company field label", name: "company", widget: "string"}
                      - {label: "Email field label", name: "email", widget: "string"}
                      - {label: "Phone field label", name: "phone", widget: "string"}
                      - {label: "Interest field label", name: "interest", widget: "string"}
                      - label: "Interest dropdown options"
                        name: "options"
                        widget: "list"
                        field: {label: "Option", name: "option", widget: "string"}
                      - {label: "Message field label", name: "message", widget: "string"}
                      - {label: "Submit button", name: "submit", widget: "string"}
                      - {label: "Sending status text", name: "sending", widget: "string"}
                      - {label: "Success status text", name: "success", widget: "string"}
                      - {label: "Error status text", name: "error", widget: "string"}

              - label: "Footer"
                name: "footer"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Tagline", name: "tagline", widget: "string"}
                  - {label: "Rights text", name: "rights", widget: "string"}

          - label: "Hebrew (עברית)"
            name: "he"
            widget: "object"
            fields: *lang_fields
